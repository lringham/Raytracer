      gloss: 64
      eta: 1.0
      transparent: false
      reflective: false
    - name: "sphere"
      kd: [1.0, 0.0, 0.0]
      ks: [1.0, 1.0, 1.0]
      Ia: .1
      gloss: 64
      eta: 1.5
      transparent: false
      reflective: false
    - name: "triangle"
      kd: [1.0, 1.0, 0.0]
