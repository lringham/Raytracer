    #   normal: [0.0, 1, 0.0]
    #   material: plane
    #   width: 50
    #   height: 50
lights:
  - type: point
    color: [1.0, 1.0, 1.0]
    position: [5, 5, 30.0]
    radius: 0.03
    intensity: 50.0
camera:
  position: [0, 3, 32.5]
  direction: [0, 0, 1]
  fov: 1.5708
  focalLength: 4
  lensRadius: 0.0
  pxWidth: 1920
  pxHeight: 1080
