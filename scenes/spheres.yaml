name: Test Scene
outputName: spheres.ppm
backgroundColor: [.2, .2, .6] # overridden if skySphere is specified
recursionDepth: 3
shadowSampleCount: 30
skySphere: sky.png
materials:
    - name: plane
      type: metallic
      kd: [1, 1, 1]
      ks: [1, 1, 1]
      Ia: 0.1
      gloss: 64
      eta: 1
      reflectivity: .5
    - name: modelPlane
      type: blinnPhong
      kd: [1, 1, 1]
      ks: [0, 0, 0]
      attenuation: [1, 1, 1]
      Ia: .1
      gloss: 64
      reflectivity: 0
      eta: 1.7
    # - name: horseSphere
    #   type: blinnPhong
    #   kd: [1, 1, 1]
    #   ks: [0, 0, 0]
    #   Ia: 1
    #   texture: horse.png
objects:
    - type: model
      filename: chief.obj
      position: [.5, 0, 0]
      material: modelPlane
    # - type: sphere
    #   position: [0, 2, 43]
    #   radius: 1
    #   material: modelPlane
    - type: plane
      position: [.5, 0.01, 0.0]
      normal: [0.0, 1, 0.0]
      material: plane
      width: 10
      height: 10
lights:
  - type: point
    color: [1.0, 1.0, 1.0]
    position: [.5, 10, 0.0]
    radius: 0.03
    intensity: 50.0
camera:
  position: [0, 10, 10]
  direction: [0, -1, -1]
  fov: 1.5708
  focalLength: 8
  lensRadius: 0.03
  pxWidth: 1920
  pxHeight: 1080
  sampleCount: 30