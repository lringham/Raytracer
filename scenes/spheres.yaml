name: Test Scene
outputName: spheres.ppm
backgroundColor: [.2, .2, .6] # overridden if skySphere is specified
recursionDepth: 3
shadowSampleCount: 10
#skySphere: sky.jpg
materials:
    - name: plane
      type: metallic
      kd: [1, 1, 1]
      ks: [.0, .0, .0]
      Ia: 0.1
      gloss: 64
      eta: 1
      checkered: true
    - name: modelPlane
      type: blinnPhong
      kd: [1, 1, 1]
      ks: [1, 1, 1]
      attenuation: [1, 1, 1]
      Ia: .1
      gloss: 64
      reflectivity: 0
      eta: 1.7
objects:
    - type: model
      filename: untitled.obj
      position: [.5, .5, 40.0]
      material: modelPlane
    # - type: sphere
    #   position: [0, 2, 43]
    #   radius: 1
    #   material: modelPlane
    - type: plane
      position: [0.0, 0, 0.0]
      normal: [0.0, 1, 0.0]
      material: plane
lights:
  - type: point
    color: [1.0, 1.0, 1.0]
    position: [3, 7, 40.0]
    radius: .2
    intensity: 200.0
camera:
  position: [7, 3.25, 40.5]
  direction: [-1, 0, 0]
  fov: 1.5708
  focalLength: 4
  lensRadius: 0.0
  pxWidth: 1920
  pxHeight: 1080
  sampleCount: 10