name: Test Scene
outputName: spheres.ppm
backgroundColor: [.2, .2, .6] # overridden if skySphere is specified
recursionDepth: 2
shadowSampleCount: 10
skySphere: sky.jpg
materials:
    - name: plane
      type: metallic
      kd: [1, 1, 1]
      ks: [.0, .0, .0]
      Ia: 0
      gloss: 64
      eta: 1.0
      checkered: true
    - name: modelPlane
      type: transparent
      kd: [1, 0, 0]
      ks: [1, 1, 1]
      Ia: .1
      gloss: 256
      eta: 2
    - name: sphere_red
      type: metallic
      kd: [1, 0, 0]
      ks: [1, 1, 1]
      Ia: .1
      gloss: 256
      eta: 1
    - name: world
      type: blinnPhong
      kd: [1, 1, 1]
      ks: [0, 0, 0]
      Ia: 1
      gloss: 1
      eta: 1
      texture: earth.jpg
objects:
    - type: model
      filename: dragon1.obj
      position: [0.0, 0, 38.0]
      material: modelPlane
    # - type: sphere
    #   position: [0, 4, 35]
    #   radius: 3
    #   material: modelPlane
    - type: plane
      position: [0.0, 0, 0.0]
      normal: [0.0, 1, 0.0]
      material: plane
lights:
  - type: point
    color: [1.0, 1.0, 1.0]
    position: [-5.0, 17, 50.0]
    radius: 0.1
    intensity: 100.0
camera:
  position: [0, 5, 50.0]
  direction: [0, 0, -1]
  fov: 1.5708
  focalLength: 14.0
  lensRadius: 0
  pxWidth: 1920
  pxHeight: 1080
  sampleCount: 10
