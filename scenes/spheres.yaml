name: Test Scene
outputName: spheres.ppm
backgroundColor: [.2, .2, .6] # overridden if skySphere is specified
recursionDepth: 3
shadowSampleCount: 10
skySphere: horse.png
materials:
    - name: plane
      type: blinnPhong
      kd: [1, 1, 1]
      ks: [.0, .0, .0]
      Ia: 0.1
      gloss: 64
      eta: 1
      checkered: true
    - name: modelPlane
      type: blinnPhong
      kd: [1, 1, 1]
      ks: [0, 0, 0]
      attenuation: [1, 1, 1]
      Ia: .1
      gloss: 64
      reflectivity: 0
      eta: 1.7
objects:
    - type: model
      filename: chief.obj
      position: [.5, 0, 40.0]
      material: modelPlane
