name: Test Scene
outputName: obj.ppm
modelsDir: "../models/"
backgroundColor: [.2, .2, .6]
recursionDepth: 0
shadowSampleCount: 1
materials:
    - name: plane
      type: blinnPhong
      kd: [0.6, .6, .6]
      ks: [1.0, 1.0, 1.0]
      Ia: 0.1
      gloss: 64
      eta: 1.0
    - name: sphere
      type: metallic
      kd: [1, 1, 1]
      ks: [1, 1, 1]
      Ia: .1
      gloss: 128
      eta: 1
    - name: sphere_red
      type: blinnPhong
      kd: [1, 0, 0]
      ks: [1, 1, 1]
      Ia: .1
      gloss: 256
